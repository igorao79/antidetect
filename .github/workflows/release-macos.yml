# Builds, signs, notarizes and publishes an Owl release on GitHub's macOS
# runner, so a release does not take a developer's Mac for half an hour. It
# runs scripts/release-macos.sh, the same script a local release runs.
#
# Starts on every push to main-antidetect and publishes when the pushed version
# (src-tauri/tauri.conf.json) has no release yet, so a version bump is what
# ships; other pushes stop after the check. It can also be started by hand:
#
#   gh workflow run release-macos.yml -R igorao79/antidetect
#
# Not on tag pushes: upstream's tags share the release names, and pushing them
# must not start a release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           the Developer ID Application certificate with
#                               its key, exported as .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   APPLE_API_ISSUER            App Store Connect API issuer id
#   APPLE_API_KEY               App Store Connect API key id
#   APPLE_API_KEY_P8            the contents of AuthKey_<key id>.p8
name: Release macOS

on:
  push:
    branches: [main-antidetect]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  # On a cheap runner, so a push that ships nothing never waits for a Mac.
  check:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no release yet."
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.new_version == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # The release profile's single codegen unit took the runner's three
      # cores about 28 minutes; sixteen compile in parallel, with thin LTO
      # still joining them, for an app that is barely slower. Set for the
      # whole job, so rust-cache's key, which hashes CARGO_* variables, tells
      # these builds' dependencies from the ones compiled with one unit.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes list the commits since the previous release.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos
          # A key that already exists is never saved again, so a cache of
          # other settings came back at every run and everything compiled
          # anew; a new prefix starts over.
          prefix-key: v1-rust
          # A run that fails at notarization keeps what it compiled.
          cache-on-failure: true

      # Next.js reported "No build cache found" and took five minutes.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/owl-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and publish
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-macos.sh

      # A run that built and notarized but could not publish (GitHub answered
      # 0.33.7's release call with 403) keeps the disk image, so it can be
      # published by hand instead of building again.
      - name: Keep the disk image when publishing failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owl-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/owl-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
