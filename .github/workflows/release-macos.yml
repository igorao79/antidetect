# Builds, signs, notarizes and publishes an Owl release on GitHub's macOS
# runners, so a release does not take a developer's Mac for half an hour. It
# runs scripts/release-macos.sh, the same script a local release runs: one
# runner builds the Apple Silicon image, another cross-compiles the Intel one
# at the same time, a Windows runner builds the x64 installer, and a last job
# publishes them once both macOS images are notarized.
#
# Starts on every push to main-antidetect that changes the app (docs, CI,
# tests and test scenarios do not) and ships it as a new version: when the
# version in src-tauri/tauri.conf.json is already released, the next patch
# number is committed to main-antidetect as "Owl <version>" and that commit is
# built. A version raised by hand to one with no release ships as it is. Pull
# before the next push: the bump commit lands on the branch. It can also be
# started by hand:
#
#   gh workflow run release-macos.yml -R igorao79/antidetect
#
# Not on tag pushes: upstream's tags share the release names, and pushing them
# must not start a release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           the Developer ID Application certificate with
#                               its key, exported as .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   APPLE_API_ISSUER            App Store Connect API issuer id
#   APPLE_API_KEY               App Store Connect API key id
#   APPLE_API_KEY_P8            the contents of AuthKey_<key id>.p8
name: Release

on:
  push:
    branches: [main-antidetect]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "e2e/**"
      - "scripts/scenarios/**"
      - "scripts/upstream-review.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  # On a cheap runner, so the bump does not wait for a Mac.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The branch as it is now, not the pushed commit: a run that waited
      # behind another starts from that run's bump.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' \
            | node scripts/next-version.mjs | tee -a "$GITHUB_OUTPUT"
      # Pushed with the workflow's own token, which starts no other run.
      - id: commit
        run: |
          if [ "${{ steps.next.outputs.bumped }}" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Owl ${{ steps.next.outputs.version }}"
            git push -q origin "HEAD:${{ github.ref_name }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # The name the Apple Silicon cache had before Intel builds came,
          # so it stays warm.
          - target: aarch64-apple-darwin
            cache: release-macos
          - target: x86_64-apple-darwin
            cache: release-macos-x86_64
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # The release profile's single codegen unit took the runner's three
      # cores about 28 minutes; sixteen compile in parallel, with thin LTO
      # still joining them, for an app that is barely slower. Set for the
      # whole job, so rust-cache's key, which hashes CARGO_* variables, tells
      # these builds' dependencies from the ones compiled with one unit.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          # The release notes list the commits since the previous release.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache }}
          # A key that already exists is never saved again, so a cache of
          # other settings came back at every run and everything compiled
          # anew; a new prefix starts over.
          prefix-key: v1-rust
          # A run that fails at notarization keeps what it compiled.
          cache-on-failure: true

      # Next.js reported "No build cache found" and took five minutes.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/owl-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-macos.sh build ${{ matrix.target }}

      # Handed to the publish job; also kept a week, so a run that built and
      # notarized but could not publish (GitHub answered 0.33.7's release call
      # with 403) can be published by hand instead of building again.
      - uses: actions/upload-artifact@v4
        with:
          name: owl-dmg-${{ matrix.target }}
          path: release-out/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/owl-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

  # The Windows x64 installer, built natively the way upstream builds it (its
  # release.yml): Owl_<version>_x64-setup.exe, the asset the Windows updater
  # picks. Not code-signed, so SmartScreen warns before its first run.
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows
          prefix-key: v1-rust
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # STABLE_RELEASE and BUILD_TAG as in release-macos.sh: a stable build
      # named after the release, which takes updates.
      - name: Build the installer
        shell: bash
        env:
          STABLE_RELEASE: "1"
          BUILD_TAG: v${{ needs.version.outputs.version }}
          CARGO_INCREMENTAL: "0"
        run: |
          pnpm tauri build --bundles nsis
          mkdir -p release-out
          cp "src-tauri/target/release/bundle/nsis/Owl_${{ needs.version.outputs.version }}_x64-setup.exe" release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: owl-windows-x64
          path: release-out/*.exe
          if-no-files-found: error
          retention-days: 7

  # Publishes only when both macOS images built, so no release lacks one. The
  # Windows installer goes with them when its job built it; a Windows failure
  # does not hold the macOS release back.
  publish:
    needs: [version, build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          # The release notes list the commits since the previous release.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: owl-*
          path: release-out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-macos.sh publish
