# Owl server: run your own, invite the people you choose.
#
#   cp .env.example .env        # set PUBLIC_URL and WORKSPACE_NAME
#   docker compose up -d --build
#   docker compose logs owl-server   # the owner's invite link is printed here
#
# With a domain name and HTTPS (ports 80 and 443 open, DNS pointing here):
#   set DOMAIN and PUBLIC_URL=https://<DOMAIN> in .env, then
#   docker compose --profile https up -d --build
#
# Everything the server keeps (members, invites, shared profiles) lives in the
# owl-data volume. Back that volume up; deleting it deletes the server.
services:
  owl-server:
    build:
      context: ..
      dockerfile: donut-sync/Dockerfile
    image: owl-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "12342"
      DATA_DIR: /data
    ports:
      - "${OWL_PORT:-12342}:12342"
    volumes:
      - owl-data:/data

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - owl-server
    environment:
      DOMAIN: ${DOMAIN:-}
    entrypoint:
      - sh
      - -c
      - 'test -n "$$DOMAIN" || { echo "Set DOMAIN in .env for the https profile"; exit 1; }; exec caddy reverse-proxy --from "$$DOMAIN" --to owl-server:12342'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  owl-data:
  caddy-data:
